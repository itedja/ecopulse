name: Big emitters (Climate TRACE, monthly)
on:
  schedule:
    - cron: '17 3 9 * *'   # 10:17 in Jakarta on the 9th of each month
  workflow_dispatch:
concurrency:
  group: emitters
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:emitters
