name: Air quality + weather (every 30 min)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency:
  group: air-weather
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Air quality
        run: npm run ingest:air
        continue-on-error: true
        id: air
      - name: Weather, wind, quakes
        run: npm run ingest:weather
        id: weather
      - name: Fail if air quality failed
        if: steps.air.outcome == 'failure'
        run: exit 1
